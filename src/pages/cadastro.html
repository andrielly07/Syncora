<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dunwich – Cadastro</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/dunwich.css">
  <script src="../assets/js/dunwich.js" defer></script>
</head>

<body>
  <div class="palco">
    <img class="p" src="../assets/img/livro.png" alt="" style="--x:894;--y:22;--w:3080">

    <p class="p creme" style="--x:90;--y:62;--w:800;--f:38;--lh:1">Seja bem-vindo(a) à</p>
    <img class="p" src="../assets/img/logo.png" alt="Dunwich" style="--x:50;--y:290;--w:820">
    <p class="p creme" style="--x:90;--y:868;--w:780;--f:38;--lh:1.05">Um lugar que resume suas histórias mais complexas
      no mundo do RPG!</p>
    <p class="p creme" style="--x:160;--y:1394;--f:21">Desenvolvido por Syncora 2026</p>

    <!-- Quando o back-end estiver pronto, troque action e method pelos dele -->
    <form action="principal.html" method="get">
      <input class="oculto" type="file" id="foto" name="foto" accept="image/*">
      <label class="p foto centro" for="foto" style="--x:1520;--y:185;--w:500;--f:24"><img src="../assets/img/avatar.png"
          alt=""><span>Adicionar uma foto</span></label>

      <label class="p" for="usuario" style="--x:1280;--y:825;--f:24">Nome de usuário:</label>
      <input class="p campo" id="usuario" name="usuario" type="text" required style="--x:1280;--y:870;--w:948">

      <label class="p" for="email" style="--x:1280;--y:1005;--f:24">Email:</label>
      <input class="p campo" id="email" name="email" type="email" required style="--x:1280;--y:1050;--w:948">

      <label class="p" for="senha" style="--x:1280;--y:1180;--f:24">Senha:</label>
      <input class="p campo" id="senha" name="senha" type="password" required style="--x:1280;--y:1230;--w:948">

      <button class="p botao" type="submit" style="--x:1280;--y:1315;--w:948">Cadastrar</button>
    </form>

    <a class="p botao botao-secundario navegacao centro" href="login.html"
      style="--x:1280;--y:1390;--w:948">Já tenho uma conta</a>
  </div>
</body>

</html>
